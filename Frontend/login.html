<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Premium Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="/src/main.js"></script>
</head>

<body class="antialiased h-screen flex items-center justify-center p-4">

    <!-- Background Elements -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl -translate-y-1/2"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-violet-600/10 rounded-full blur-3xl translate-y-1/2"></div>
    </div>

    <!-- Login Card -->
    <main class="relative z-10 w-full max-w-md">
        <div class="glass-panel p-8 md:p-10 animate-fade-in-up">
            <div class="text-center mb-8">
                <h2
                    class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-500 dark:from-white dark:to-gray-400">
                    Welcome Back</h2>
                <p class="text-slate-600 dark:text-slate-400 mt-2">Sign in to continue to your dashboard</p>
            </div>

            <form id="login-form" class="space-y-6">
                <div class="space-y-2">
                    <label for="username"
                        class="text-sm font-medium text-slate-700 dark:text-slate-300 ml-1">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required
                        class="glass-input focus:ring-2 ring-indigo-500/50" />
                </div>

                <div class="space-y-2">
                    <label for="password"
                        class="text-sm font-medium text-slate-700 dark:text-slate-300 ml-1">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                        class="glass-input focus:ring-2 ring-indigo-500/50" />
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full btn-primary flex justify-center items-center gap-2 group">
                        <span>Sign In</span>
                        <svg class="w-4 h-4 transition-transform group-hover:translate-x-1" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </button>
                </div>
            </form>

            <div class="mt-8 text-center text-sm text-slate-400">
                Don't have an account?
                <a href="/register.html"
                    class="text-indigo-400 hover:text-indigo-300 font-semibold transition-colors">Create account</a>
            </div>
        </div>
    </main>

</body>

</html>
